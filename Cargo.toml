[package]
name = "magnet-box"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
percent-encoding = "2.3.2"
rocket = "0.5.2"
rocket_db_pools = { version = "0.2.0", features = ["sqlx_sqlite"] }
rocket_dyn_templates = { version = "0.2.0", features = ["handlebars"] }
scc = "3.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_bencoded = "0.3.2"
serde_bytes = "0.11.19"
serde_json = "1.0.154"
serde-querystring = "0.3.0"
sqlx = { version = "0.7", features = [
    "chrono",
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
    "uuid",
] }
rand = "0.10.3"
indexmap = "2.14.2"
serde-inline-default = "1.0.3"
uuid = { version = "1.29.0", features = ["v4"] }
humansize = "2.1.3"
