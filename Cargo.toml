cargo-features = ["edition2024"]

[package]
name = "magnet-box"
version = "1.0.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
percent-encoding = "2.3.2"
rocket = { version = "0.5.2", features = ["secrets"] }
rocket_db_pools = { version = "0.2.0", features = ["sqlx_sqlite"] }
rocket_dyn_templates = { version = "0.2.0", features = ["handlebars"] }
scc = "3.8.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
serde-querystring = "0.3.0"
sqlx = { version = "0.7", features = [
    "chrono",
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
    "uuid",
] }
rand = "0.10.3"
indexmap = "2.14.2"
serde-inline-default = "1.0.3"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
humansize = "2.1.3"
password-auth = "1.0.0"
sha = "1.0.3"
hightorrent = "0.4.1"
bt_bencode = "0.8.2"
hex = { version = "0.4.3", features = ["serde"] }
rss = { version = "2.1.2", features = ["atom"] }

[package.metadata.patch.hightorrent]
version = "0.4.1"
patches = ["patches/hightorrent.patch"]

[patch.crates-io]
hightorrent = { path = "target/patch/hightorrent-0.4.1" }
